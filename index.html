<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Ứng dụng công nghệ thực tế tăng cường (AR) trong giáo dục lịch sử địa phương</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: white;
        }

        h1 {
            text-align: center;
            color: #8B0000;
        }

        h2 {
            color: #8B0000;
        }

        .box {
            border: 2px solid red;
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .title {
            padding: 15px;
            color: blue;
            font-size: 20px;
            cursor: pointer;
            text-decoration: underline;
        }

        .content {
            display: none;
            padding: 20px;
            line-height: 1.6;
        }

        button {
            padding: 12px 20px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
